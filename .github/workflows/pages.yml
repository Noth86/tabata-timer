# A ogni push su main: prima i test automatici, poi (solo se passano) la pubblicazione su GitHub Pages.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test automatici
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installa WebKit (motore di Safari)
        run: npx playwright install --with-deps webkit
      - name: Esegui i test
        run: npx playwright test
      - name: Salva il report e le foto se qualcosa fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: |
            playwright-report/
            test-results/
            qa-screenshots/
          retention-days: 14

  deploy:
    name: Pubblica
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inserisci il numero di versione
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" app/sw.js app/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
