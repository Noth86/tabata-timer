<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabata">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Tabata Timer</title>
</head>
<body>
  <header class="topbar">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="stopwatch" role="tab">Cronometro</button>
      <button class="tab" data-view="tabata" role="tab">Allenamento</button>
    </nav>
    <div class="top-actions">
      <button id="wake-indicator" class="pill" role="switch" aria-checked="true" title="Schermo sempre acceso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span id="wake-label" class="pill-label">Schermo sempre acceso</span>
        <span class="switch-ui" aria-hidden="true"></span>
      </button>
      <button id="install-btn" class="pill install hidden" title="Installa come app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        <span class="pill-label">Installa app</span>
      </button>
      <button id="fullscreen-btn" class="icon-btn" title="Schermo intero">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <dialog id="install-dialog" class="sheet">
    <h2>Installa Tabata Timer</h2>
    <p class="sheet-intro">È una web app: installata, si apre dall'icona a tutto schermo, senza barre del browser, e funziona anche senza internet.</p>
    <div id="install-steps"></div>
    <form method="dialog"><button class="btn primary">Ho capito</button></form>
  </dialog>

  <!-- CRONOMETRO -->
  <main id="view-stopwatch" class="view active">
    <div class="sw-display">
      <div class="sw-time"><span id="sw-main">00:00</span><span id="sw-cs" class="cs">.00</span></div>
    </div>
    <div class="controls">
      <button id="sw-reset" class="btn secondary">Azzera</button>
      <button id="sw-toggle" class="btn primary">Avvia</button>
      <button id="sw-lap" class="btn secondary" disabled>Giro</button>
    </div>
    <ol id="sw-laps" class="laps"></ol>
  </main>

  <!-- ALLENAMENTO: impostazioni -->
  <main id="view-tabata" class="view">
    <div class="setup">
      <div id="mode-tabs" class="modes" role="tablist"></div>
      <p id="mode-desc" class="mode-desc"></p>

      <div class="preset-row">
        <select id="preset-select" aria-label="Preset"></select>
        <button id="preset-save" class="btn small secondary">Salva</button>
        <button id="preset-delete" class="btn small secondary">Elimina</button>
      </div>

      <div id="fields" class="fields"></div>
      <div id="exercises" class="exercises hidden"></div>

      <div class="options">
        <label class="switch"><input type="checkbox" id="opt-sound" checked> Suoni</label>
        <label class="switch"><input type="checkbox" id="opt-voice"> Voce</label>
      </div>

      <div class="total">Durata totale: <strong id="total-time">0:00</strong></div>
      <button id="tb-start" class="btn primary big">Inizia</button>
      <button id="app-version" class="app-version" type="button"></button>
    </div>
  </main>

  <!-- ALLENAMENTO: in esecuzione (sovrapposto a tutto lo schermo) -->
  <section id="tabata-run" class="run hidden" data-phase="prep">
    <div class="run-top">
      <button id="tb-close" class="icon-btn" title="Chiudi">✕</button>
      <div class="run-info">
        <span id="run-round"></span>
        <span id="run-counter" class="run-counter hidden">
          <button id="cnt-minus" class="mini-btn" type="button" aria-label="Togli un round">−</button>
          <span id="cnt-value">0 round</span>
        </span>
      </div>
      <span id="run-remaining" class="run-remaining">0:00</span>
    </div>
    <div class="run-center" id="run-center">
      <div id="run-phase" class="run-phase">PREPARATI</div>
      <div id="run-seconds" class="run-seconds">10</div>
      <div id="run-next" class="run-next"></div>
    </div>
    <div class="progress"><div id="run-progress" class="progress-bar"></div></div>
    <div class="controls run-controls">
      <button id="tb-restart" class="btn secondary">Ricomincia</button>
      <button id="tb-done" class="btn secondary hidden">Fatto</button>
      <button id="tb-toggle" class="btn primary">Pausa</button>
      <button id="tb-skip" class="btn secondary">Salta</button>
      <button id="tb-count" class="btn secondary count hidden">+1 Round</button>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
